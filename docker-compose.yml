services:
  postgres:
    # orchestrator 2.3.0 부터 대화 스레드(/threads)를 PostgreSQL 에 저장한다.
    # 없으면 기동 시 alembic 마이그레이션이 실패하고 API 가 안 뜬다.
    #
    # 기동 로그가 "orchestrator-postgres" 와 "postgres" 두 호스트명을 찾으므로
    # 네트워크 별칭을 둘 다 달아 어느 쪽으로 와도 연결되게 함.
    image: postgres:16-alpine
    container_name: copilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      copilot-net:
        aliases:
          - postgres
          - orchestrator-postgres
    healthcheck:
      # DB 가 접속 가능해진 뒤에 orchestrator 가 마이그레이션을 돌리도록
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # 벡터 검색(RediSearch 모듈)이 필요하므로 일반 redis 이미지가 아닌 redis-stack-server 사용
    image: redis/redis-stack-server:latest
    container_name: copilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      # 적재한 벡터 데이터를 보존 (없으면 docker compose down 시 데이터 소실)
      - redis-data:/data
    networks:
      - copilot-net

  data-loader:
    # 공식 unstruct 이미지에 redis 라이브러리를 추가한 커스텀 이미지 (Dockerfile 참고)
    # 실행: docker compose up -d --build
    build: .
    image: copilot-data-loader-ocr-redis:local
    container_name: copilot-data-loader
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "8082:8080"
    volumes:
      # 호스트의 PDF 문서 폴더를 컨테이너 내부 /docs 로 마운트
      - "${DOCS_DIR}:/docs"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - copilot-net
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      SECRET_KEY: ${SECRET_KEY}
      HASHED_ADMIN_PASSWORD: ${HASHED_ADMIN_PASSWORD}
      ACCESS_TOKEN_EXPIRE_DAYS: ${ACCESS_TOKEN_EXPIRE_DAYS}

      # plugins
      VECTORDB_PLUGIN_ENTRY_POINT: ${VECTORDB_PLUGIN_ENTRY_POINT}
      # orchestrator 는 2.3.0 이라 ollama_enhanced 를 요구하지만 data-loader 이미지는
      # 2.0.0 계열이라 그 모듈이 없다. 같은 변수를 공유하면 data-loader 가
      # ModuleNotFoundError 로 크래시 루프에 빠지므로 여기만 따로 지정한다.
      MODEL_PLUGIN_ENTRY_POINT: ${DATA_LOADER_MODEL_PLUGIN_ENTRY_POINT:-plugins.models.ollama:OllamaPlugin}
      EMBEDDINGS_PLUGIN_ENTRY_POINT: ${EMBEDDINGS_PLUGIN_ENTRY_POINT}

      # models
      MODEL_NAME: ${MODEL_NAME}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}

      # Ollama (컨테이너에서 호스트 PC의 Ollama 접근)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}

      # VectorDB (같은 네트워크의 redis 서비스명으로 접근)
      REDIS_URL: ${REDIS_URL}
      # orchestrator 쪽과 반드시 같은 값이어야 적재한 문서를 검색할 수 있음
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-}

  orchestrator:
    # 태그는 .env 의 ORCHESTRATOR_TAG 로 지정 (미지정 시 latest).
    # latest 가 FASTAPI_APP_VERSION=2.0.0 이라 프론트엔드보다 뒤처질 수 있음.
    image: public.ecr.aws/tds/llm-orchestrator:${ORCHESTRATOR_TAG:-latest}
    container_name: copilot-orchestrator
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - copilot-net
    volumes:
      # orchestrator 이미지의 임베딩 플러그인은 OLLAMA_BASE_URL/EMBEDDING_MODEL_NAME 을
      # 무시하는 원본이라, 질문 벡터가 data loader 가 저장한 문서 벡터와 안 맞아 검색이 0건이 됨.
      # data loader 와 동일한 패치 파일로 덮어써서 같은 임베딩(nomic-embed-text)을 쓰게 함.
      - "./ollama_embeddings_plugin.py:/app/plugins/embeddings/ollama.py:ro"
      # 원본 검색기는 MultiVectorRetriever(doc_id 기반 2단계)라 우리 저장 방식과 안 맞아
      # 항상 0건 반환 → 단순 벡터 검색기로 교체
      - "./redis_retriever_plugin.py:/app/plugins/retrievers/redis.py:ro"
      # data loader 와 동일한 스키마(source/page 포함)를 써야 검색 시 출처가 실림
      - "./redis_schema.yml:/app/plugins/retrievers/schema.yml:ro"
      # 원본 main.py 는 응답의 sources 를 항상 빈 채로 반환 → 검색 문서로 sources 를
      # 채우도록 패치한 main.py 로 교체 (파일 상단 주석 참고)
      #
      # 이 파일은 2.0.0 이미지의 main.py 를 기반으로 패치한 것이라, 다른 버전
      # 이미지에 덮어씌우면 그 버전의 새 엔드포인트(/threads, /agents 등)가
      # 통째로 사라져 업그레이드가 무의미해진다.
      # ORCHESTRATOR_TAG 를 바꿀 때는 .env 의 ORCHESTRATOR_MAIN_TARGET 을
      # /tmp/... 로 돌려 이 패치를 비활성화할 것.
      - "./orchestrator_main.py:${ORCHESTRATOR_MAIN_TARGET:-/app/main.py}:ro"
      # 채팅 모델 num_ctx 미지정(기본 2048)으로 문맥 초과 시 출력이 깨짐 → num_ctx 상향 패치
      - "./ollama_model_plugin.py:/app/plugins/models/ollama.py:ro"
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      SECRET_KEY: ${SECRET_KEY}
      HASHED_ADMIN_PASSWORD: ${HASHED_ADMIN_PASSWORD}
      ACCESS_TOKEN_EXPIRE_DAYS: ${ACCESS_TOKEN_EXPIRE_DAYS}

      # Spotfire 프론트엔드 client 자격증명
      # 2.3.0 은 OAUTH2_* 를 쓰고, 없으면 임의 클라이언트를 자동 생성해 인증이 실패함
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID:-}
      OAUTH2_CLIENT_SECRET_HASH: ${OAUTH2_CLIENT_SECRET_HASH:-}
      # 2.0.0 자체 패치(/client/token)용 - 되돌릴 때를 위해 유지
      COPILOT_CLIENT_ID: ${COPILOT_CLIENT_ID}
      COPILOT_CLIENT_SECRET: ${COPILOT_CLIENT_SECRET}

      # plugins
      RETRIEVER_PLUGIN_ENTRY_POINT: ${RETRIEVER_PLUGIN_ENTRY_POINT}
      MODEL_PLUGIN_ENTRY_POINT: ${MODEL_PLUGIN_ENTRY_POINT}
      SECONDARY_MODEL_PLUGIN_ENTRY_POINT: ${SECONDARY_MODEL_PLUGIN_ENTRY_POINT}
      EMBEDDINGS_PLUGIN_ENTRY_POINT: ${EMBEDDINGS_PLUGIN_ENTRY_POINT}

      # models
      MULTI_MODAL_MODEL_NAME: ${MULTI_MODAL_MODEL_NAME}
      COMPLETIONS_MODEL_NAME: ${COMPLETIONS_MODEL_NAME}
      CHAT_SIMPLE_MODEL_NAME: ${CHAT_SIMPLE_MODEL_NAME}
      CHAT_COMPLEX_MODEL_NAME: ${CHAT_COMPLEX_MODEL_NAME}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}

      # 모델 컨텍스트 크기. 지정하지 않으면 플러그인 기본값(8192)을 씀.
      # 스크린샷 판독은 토큰을 많이 먹으므로 넉넉히 잡아야 함.
      CHAT_NUM_CTX: ${CHAT_NUM_CTX:-}

      # 대화 스레드 엔드포인트 스텁 (실험용, 비우면 꺼짐)
      COPILOT_THREAD_STUBS: ${COPILOT_THREAD_STUBS:-}

      # 인텐트 라벨 교정 (Analyst 가 라벨을 거부할 때만 사용, 비우면 내장 분류기 결과 사용)
      COPILOT_INTENT_LABELS: ${COPILOT_INTENT_LABELS:-}
      COPILOT_INTENT_DEFAULT: ${COPILOT_INTENT_DEFAULT:-}

      # prompts.py 가 하드코딩한 벤더 데모 인덱스명을 실제 이름으로 교정
      COPILOT_USER_DOCS_INDEX: ${COPILOT_USER_DOCS_INDEX:-}
      COPILOT_SPOTFIRE_DOCS_INDEX: ${COPILOT_SPOTFIRE_DOCS_INDEX:-}

      # PostgreSQL (2.3.0+ 의 대화 스레드 저장소)
      # 실제 변수명은 이미지마다 다를 수 있음:
      #   docker run --rm --entrypoint env public.ecr.aws/tds/llm-orchestrator:2.3.0
      # 로 확인한 뒤 안 맞는 이름은 여기에 추가할 것.
      POSTGRES_HOST: ${POSTGRES_HOST:-orchestrator-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@orchestrator-postgres:5432/orchestrator}

      # Ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}

      # VectorDB
      REDIS_URL: ${REDIS_URL}
      # 비워두면 인덱스 이름을 키 접두사로 사용(인덱스별 문서 분리).
      # data-loader 와 반드시 같은 값이어야 검색이 됨.
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-}

      # Optional monitoring (Langsmith)
      # 빈 값이 들어가면 "LangSmith API URL cannot be empty" 오류로 컨테이너가 죽으므로 기본 URL 지정
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_ENDPOINT: ${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT}

networks:
  copilot-net:
    name: copilot-net

volumes:
  redis-data:
  postgres-data:
